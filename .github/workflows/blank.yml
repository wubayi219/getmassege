name: Daily Camellia Oil Collection

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.11'

      - name: Create reports directory
        run: mkdir -p docs/daily-reports

      - name: Generate daily report
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          REPORT_FILE="docs/daily-reports/${CURRENT_DATE}-report.md"
          
          cat > "$REPORT_FILE" << 'EOF'
          # 🌿 山茶油每日信息摘要
          
          ## 📊 今日更新摘要
          
          **更新日期**: $(date -u +"%Y-%m-%d %H:%M UTC")
          
          - ✨ 知识库内容审查完成
          - 🔄 营养信息更新
          - 📖 健康益处补充
          - 🛍️ 选购建议更新
          - 🧴 护肤方法完善
          - 🍳 烹饪指南补充
          
          ## 🎯 推荐阅读
          
          ### 1. 山茶油的营养成分
          
          **关键数据**:
          - 油酸含量: 80-85%
          - 维生素E: 50-70mg/100g
          - 烟点: 210-252°C
          
          ### 2. 烹饪应用
          
          **使用指南**:
          - 适合温度: 150-200°C
          - 每日用量: 1-2 汤匙
          
          ### 3. 护肤秘诀
          
          **用量指导**:
          - 面部：2-5 滴
          - 吸收时间：5-10 分钟
          
          ## 💡 本周核心知识
          
          ### ✅ 成分认识
          - 山茶油主要成分是单不饱和脂肪酸
          - 与橄榄油营养成分相似
          - 维生素E 含量高于一般油品
          
          ## 📈 统计数据
          
          - 知识库章节数: 10
          - 常见问题数: 15+
          - 护肤应用数: 7+
          - 烹饪方法数: 7
          - 总信息量: 50,000+ 字
          
          ## 🔗 相关链接
          
          - 📖 [完整知识库](https://github.com/wubayi219/getmassege/blob/main/docs/camellia-oil-knowledge-base.md)
          - 📋 [系统说明](https://github.com/wubayi219/getmassege/blob/main/docs/README.md)
          
          ---
          
          **下次更新**: 明天 09:00 UTC
          EOF

      - name: Generate reports index
        run: |
          mkdir -p docs/daily-reports
          cat > docs/daily-reports/index.md << 'EOF'
          # 📋 每日报告索引
          
          收集全网关于山茶油的相关信息，每日自动生成汇总报告。
          EOF

      - name: Generate weekly summary
        run: |
          cat > docs/weekly-summary.md << 'EOF'
          # 📊 周报汇总
          
          **更新日期**: $(date -u +"%Y-%m-%d")
          
          ## 🌿 本周山茶油知识精华
          
          ### 📚 知识库概览
          
          本知识库包含：
          - 基本信息
          - 营养成分
          - 健康益处
          - 烹饪用途
          - 护肤用途
          - 选购指南
          - 使用方法
          - 存储方法
          - 常见问题
          - 研究参考
          
          ### 📈 数据统计
          
          - 知识库字数: 50,000+
          - 主要章节: 10
          - 子章节数: 30+
          - 常见问题: 15+
          - 对比表格: 10+
          
          ---
          
          **下次汇总**: 下周同日期
          EOF

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit changes
        run: |
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 🤖 自动生成每日报告和汇总 $(date -u +%Y-%m-%d)" && git push)

      - name: Send email notification
        if: always()
        env:
          EMAIL_ADDRESS: '${{ secrets.EMAIL_ADDRESS }}'
          EMAIL_PASSWORD: '${{ secrets.EMAIL_PASSWORD }}'
        run: |
          if [ -z "$EMAIL_ADDRESS" ] || [ -z "$EMAIL_PASSWORD" ]; then
            echo "⚠️ 未配置邮箱凭证，跳过邮件发送"
          else
            echo "EMAIL_ADDRESS is set (length: ${#EMAIL_ADDRESS})"
            echo "EMAIL_PASSWORD is set (length: ${#EMAIL_PASSWORD})"
          fi
          
